<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chore Points</title>
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Chore Points</h1>
    <label class="me">I am
      <select id="me"></select>
    </label>
  </header>

  <main id="view" aria-live="polite"><p class="empty">Loading…</p></main>

  <nav class="tabs" id="tabs">
    <button data-tab="chores">🧽<span>Chores</span></button>
    <button data-tab="scores">🏆<span>Scores</span></button>
    <button data-tab="rewards">🎁<span>Rewards</span></button>
    <button data-tab="history">🕓<span>History</span></button>
    <button data-tab="manage">⚙️<span>Manage</span></button>
  </nav>

  <div id="toast" class="toast" hidden></div>
  <dialog id="picker"></dialog>

  <script src="app.js"></script>
</body>
</html>
